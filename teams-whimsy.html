<!doctype html><meta charset=utf-8>
<style>
 :root{--gold:#EBBC79;--gold-deep:#9A6F2E;--paper:#F7F2E9;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
 *{box-sizing:border-box;margin:0;} body{background:#333;}
 .bg{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--sans);}
 .ic{position:absolute;} .ic svg{display:block;}
 .brand{position:absolute;left:150px;top:116px;display:flex;flex-direction:column;gap:14px;z-index:2;}
 .brand img{height:200px;width:auto;display:block;}
 .brand .rule{width:200px;height:3px;background:var(--gold);opacity:.55;}
 .brand .sub{font-size:25px;letter-spacing:.30em;text-transform:uppercase;}
 .vig{position:absolute;inset:0;pointer-events:none;}
 /* dark whimsy */
 .dark{background:radial-gradient(150% 150% at 24% 20%,#2d2d34 0%,#191a1d 55%,#0d0d0f 100%);}
 .dark .brand .sub{color:var(--gold);}
 .dark .vig{box-shadow:inset 0 0 340px 70px rgba(0,0,0,.5);}
 /* light whimsy */
 .light{background:radial-gradient(150% 150% at 24% 20%,#fdf9f2 0%,var(--paper) 45%,#e9ddc9 100%);}
 .light .brand .rule{background:var(--gold-deep);} .light .brand .sub{color:var(--gold-deep);}
 .light .vig{box-shadow:inset 0 0 300px 50px rgba(120,95,50,.10);}
</style>
